name: Build WorldSense v3.1 APK

on:
  push:
    branches:
      - worldsense-v31-build-20260820
    paths:
      - 'worldsense-v31/**'
      - '.github/workflows/worldsense-v31-build.yml'

permissions:
  contents: write

concurrency:
  group: worldsense-v31-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct patch compile sign verify
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/worldsense-v31-out"
          SRC="$GITHUB_WORKSPACE/worldsense-v31-src"
          BASEZIP="$GITHUB_WORKSPACE/WorldSense-v3.0.0-SOURCE.zip"
          PATCH="$GITHUB_WORKSPACE/worldsense-v31.patch"
          LOG="$OUT/build-log.txt"
          STATUS="$OUT/build-status.txt"
          KEYSTORE="$GITHUB_WORKSPACE/worldsense-v1-signing/worldsense-v1-dev.jks"
          rm -rf "$OUT" "$SRC" "$BASEZIP" "$PATCH"
          mkdir -p "$OUT" "$SRC"
          : > "$LOG"
          code=0

          echo '=== reconstruct verified v3 base ===' >> "$LOG"
          cat worldsense-v3/chunks/part* | tr -d '\r\n' | base64 -d > "$BASEZIP" 2>> "$LOG"
          code=$?
          if [ "$code" -eq 0 ]; then
            echo '4cf295bad70c0de9d68117a75e5a90fd96eb92e34d685310455e4445651f54ee  WorldSense-v3.0.0-SOURCE.zip' | sha256sum -c - >> "$LOG" 2>&1
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            unzip -q "$BASEZIP" -d "$SRC" >> "$LOG" 2>&1
            code=$?
          fi

          echo '=== reconstruct 3.1 delta ===' >> "$LOG"
          if [ "$code" -eq 0 ]; then
            cat worldsense-v31/patch/part* | tr -d '\r\n' | base64 -d | gzip -d > "$PATCH" 2>> "$LOG"
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            echo 'c9b2a24456cb923b1b6a7c08ba5c6198c6e5ccd8744178ba96e88b1505c9d88e  worldsense-v31.patch' | sha256sum -c - >> "$LOG" 2>&1
            code=$?
          fi

          echo '=== apply 3.1 delta ===' >> "$LOG"
          if [ "$code" -eq 0 ]; then
            patch -p1 -d "$SRC" < "$PATCH" >> "$LOG" 2>&1
            code=$?
          fi

          echo '=== verify patched source ===' >> "$LOG"
          if [ "$code" -eq 0 ]; then
            cd "$SRC"
            sha256sum app/build.gradle app/src/main/java/com/ghost/worldsense/MainActivity.java app/src/main/java/com/ghost/worldsense/WorldMapView.java app/src/main/java/com/ghost/worldsense/WorldDb.java >> "$LOG" 2>&1
            echo 'c5e767b0d782288ed2bcebf4b52d8fe43044b3889ee3f1cfd178a4ce336433de  app/build.gradle' | sha256sum -c - >> "$LOG" 2>&1 || code=$?
            echo '40ce4149baa06040b0206bf1364c7e254a9fc91d246cf01b937f07c3a8ddf13b  app/src/main/java/com/ghost/worldsense/MainActivity.java' | sha256sum -c - >> "$LOG" 2>&1 || code=$?
            echo '1e5c9350534888f9bcf5b0f7743f7afa61d1f1f5d2abfd63cb68e4241cd8d427  app/src/main/java/com/ghost/worldsense/WorldMapView.java' | sha256sum -c - >> "$LOG" 2>&1 || code=$?
            echo '562d7aa2fc58f4b2c6737e02c3d39eeb031875583181e6137380914bd8c8b5f1  app/src/main/java/com/ghost/worldsense/WorldDb.java' | sha256sum -c - >> "$LOG" 2>&1 || code=$?
            grep -E 'applicationId|versionCode|versionName' app/build.gradle >> "$LOG" 2>&1
            cd "$GITHUB_WORKSPACE"
          fi

          echo '=== gradle release compile ===' >> "$LOG"
          if [ "$code" -eq 0 ]; then
            cd "$SRC"
            gradle --no-daemon :app:assembleRelease >> "$LOG" 2>&1
            code=$?
            cd "$GITHUB_WORKSPACE"
          fi

          if [ "$code" -eq 0 ] && [ ! -f "$KEYSTORE" ]; then
            echo 'Stable WorldSense signing key missing' >> "$LOG"
            code=91
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== align sign verify ===' >> "$LOG"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
            if [ -z "$BT" ]; then
              echo 'Android build-tools directory not found' >> "$LOG"
              code=90
            else
              UNSIGNED="$SRC/app/build/outputs/apk/release/app-release-unsigned.apk"
              ALIGNED="$OUT/WorldSense-v3.1.0-aligned.apk"
              APK="$OUT/WorldSense-v3.1.0.apk"
              "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED" >> "$LOG" 2>&1
              code=$?
              if [ "$code" -eq 0 ]; then
                "$BT/apksigner" sign \
                  --ks "$KEYSTORE" \
                  --ks-pass pass:worldsense-dev-2026 \
                  --key-pass pass:worldsense-dev-2026 \
                  --ks-key-alias worldsense-v1 \
                  --out "$APK" "$ALIGNED" >> "$LOG" 2>&1
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                "$BT/apksigner" verify --verbose --print-certs "$APK" > "$OUT/signing-report.txt" 2>&1
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                if [ -x "$BT/aapt" ]; then
                  "$BT/aapt" dump badging "$APK" > "$OUT/package-report.txt" 2>&1
                else
                  "$BT/aapt2" dump badging "$APK" > "$OUT/package-report.txt" 2>&1
                fi
                grep -m1 '^package:' "$OUT/package-report.txt" >> "$LOG" 2>&1
                if ! grep -q "name='com.ghost.worldsense2'" "$OUT/package-report.txt" || ! grep -q "versionCode='30100'" "$OUT/package-report.txt" || ! grep -q "versionName='3.1.0'" "$OUT/package-report.txt"; then
                  echo 'Package/version verification FAILED' >> "$LOG"
                  code=92
                fi
              fi
              if [ "$code" -eq 0 ]; then
                rm -f "$ALIGNED"
                (cd "$OUT" && sha256sum WorldSense-v3.1.0.apk > WorldSense-v3.1.0.apk.sha256)
                ls -lh "$APK" >> "$LOG" 2>&1
              fi
            fi
          fi

          if [ "$code" -eq 0 ]; then
            printf 'WorldSense v3.1.0 build outcome: success\nWorkflow source commit: %s\nPatch SHA-256: c9b2a24456cb923b1b6a7c08ba5c6198c6e5ccd8744178ba96e88b1505c9d88e\n' "$GITHUB_SHA" > "$STATUS"
          else
            printf 'WorldSense v3.1.0 build outcome: failed\nWorkflow source commit: %s\nExit code: %s\n' "$GITHUB_SHA" "$code" > "$STATUS"
          fi
          exit 0

      - name: Commit build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldsense-v31-out || true
          git commit -m 'Record WorldSense v3.1.0 build result' || true
          git pull --rebase origin worldsense-v31-build-20260820 || true
          git push origin HEAD:worldsense-v31-build-20260820
