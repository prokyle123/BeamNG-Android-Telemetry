name: Build WorldSense v2.0.2 CLEAN APK

on:
  push:
    branches:
      - worldsense-v2-build-20260820
    paths:
      - 'worldsense-v2/**'
      - 'worldsense-v2-trigger/**'
      - '.github/workflows/worldsense-v2-build.yml'

permissions:
  contents: write

concurrency:
  group: worldsense-v2-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build sign verify and record diagnostics
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/worldsense-v2-out"
          SRC="$GITHUB_WORKSPACE/worldsense-v2-src"
          ZIP="$GITHUB_WORKSPACE/WorldSense-v2.0.0-SOURCE.zip"
          LOG="$OUT/build-log.txt"
          STATUS="$OUT/build-status.txt"
          KEYSTORE="$GITHUB_WORKSPACE/worldsense-v1-signing/worldsense-v1-dev.jks"
          rm -rf "$OUT" "$SRC" "$ZIP"
          mkdir -p "$OUT" "$SRC"
          : > "$LOG"
          code=0

          echo '=== reconstruct source chunks ===' >> "$LOG"
          cat worldsense-v2/chunks/part* | tr -d '\r\n' | base64 -d > "$ZIP" 2>> "$LOG"
          code=$?

          if [ "$code" -eq 0 ]; then
            echo '=== verify source ===' >> "$LOG"
            echo 'a998e6661acfb23e0a6f5f07846d48bf5e97616a76b40514ed0fcd7c56397bbb  WorldSense-v2.0.0-SOURCE.zip' | sha256sum -c - >> "$LOG" 2>&1
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== unpack source ===' >> "$LOG"
            unzip -q "$ZIP" -d "$SRC" >> "$LOG" 2>&1
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== apply clean-install package + version ===' >> "$LOG"
            sed -i "s/applicationId 'com.ghost.worldsense'/applicationId 'com.ghost.worldsense2'/" "$SRC/app/build.gradle"
            sed -i 's/versionCode 200/versionCode 20002/' "$SRC/app/build.gradle"
            sed -i "s/versionName '2.0.0'/versionName '2.0.2'/" "$SRC/app/build.gradle"
            grep -E 'applicationId|versionCode|versionName' "$SRC/app/build.gradle" >> "$LOG"
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== gradle release compile ===' >> "$LOG"
            cd "$SRC"
            gradle --no-daemon :app:assembleRelease >> "$LOG" 2>&1
            code=$?
            cd "$GITHUB_WORKSPACE"
          fi

          if [ "$code" -eq 0 ] && [ ! -f "$KEYSTORE" ]; then
            echo 'Stable WorldSense v1 signing key missing' >> "$LOG"
            code=91
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== align and sign with stable WorldSense key ===' >> "$LOG"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
            if [ -z "$BT" ]; then
              echo 'Android build-tools directory not found' >> "$LOG"
              code=90
            else
              UNSIGNED="$SRC/app/build/outputs/apk/release/app-release-unsigned.apk"
              ALIGNED="$OUT/WorldSense-v2.0.2-CLEAN-aligned.apk"
              APK="$OUT/WorldSense-v2.0.2-CLEAN.apk"
              "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED" >> "$LOG" 2>&1
              code=$?
              if [ "$code" -eq 0 ]; then
                "$BT/apksigner" sign \
                  --ks "$KEYSTORE" \
                  --ks-pass pass:worldsense-dev-2026 \
                  --key-pass pass:worldsense-dev-2026 \
                  --ks-key-alias worldsense-v1 \
                  --out "$APK" "$ALIGNED" >> "$LOG" 2>&1
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                "$BT/apksigner" verify --verbose --print-certs "$APK" > "$OUT/signing-report.txt" 2>&1
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                "$BT/aapt" dump badging "$APK" > "$OUT/package-report.txt" 2>&1
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                rm -f "$ALIGNED"
                (cd "$OUT" && sha256sum WorldSense-v2.0.2-CLEAN.apk > WorldSense-v2.0.2-CLEAN.apk.sha256)
              fi
            fi
          fi

          if [ "$code" -eq 0 ]; then
            printf 'WorldSense v2.0.2 CLEAN build outcome: success\nWorkflow source commit: %s\n' "$GITHUB_SHA" > "$STATUS"
          else
            printf 'WorldSense v2.0.2 CLEAN build outcome: failed\nWorkflow source commit: %s\nExit code: %s\n' "$GITHUB_SHA" "$code" > "$STATUS"
          fi
          exit 0

      - name: Commit build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldsense-v2-out || true
          git commit -m 'Record WorldSense v2.0.2 CLEAN build result' || true
          git pull --rebase origin worldsense-v2-build-20260820 || true
          git push origin HEAD:worldsense-v2-build-20260820
