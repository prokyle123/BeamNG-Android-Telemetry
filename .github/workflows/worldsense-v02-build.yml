name: Build WorldSense v0.2 APK

on:
  push:
    branches:
      - worldsense-build-v0.2.0-20260820
    paths:
      - 'worldsense02/**'
      - '.github/workflows/worldsense-v02-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct and verify WorldSense source
        shell: bash
        run: |
          set -euo pipefail
          cat worldsense02/src.part* | tr -d '\r\n' | base64 -d > WorldSense-v0.2.0-SOURCE.zip
          echo '592a0cc25652f51ef20d52d9382964de7b70cb7b8dc968c9adb75eeb6dadd689  WorldSense-v0.2.0-SOURCE.zip' | sha256sum -c -
          rm -rf worldsense02-src worldsense02-out
          mkdir -p worldsense02-src worldsense02-out
          unzip -q WorldSense-v0.2.0-SOURCE.zip -d worldsense02-src

      - name: Compile WorldSense v0.2
        id: compile
        shell: bash
        run: |
          set +e
          cd worldsense02-src
          gradle --no-daemon :app:assembleDebug > ../worldsense02-out/build-log.txt 2>&1
          code=$?
          cd ..
          if [ "$code" -eq 0 ]; then
            cp worldsense02-src/app/build/outputs/apk/debug/app-debug.apk worldsense02-out/WorldSense-v0.2.0.apk
            (cd worldsense02-out && sha256sum WorldSense-v0.2.0.apk > WorldSense-v0.2.0.apk.sha256)
            printf 'WorldSense v0.2.0 build outcome: success\nWorkflow source commit: %s\n' "$GITHUB_SHA" > worldsense02-out/build-status.txt
          else
            printf 'WorldSense v0.2.0 build outcome: failed\nWorkflow source commit: %s\nExit code: %s\n' "$GITHUB_SHA" "$code" > worldsense02-out/build-status.txt
          fi
          exit 0

      - name: Commit build result for phone handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldsense02-out
          git commit -m 'Record WorldSense v0.2.0 build result' || true
          git push origin HEAD:worldsense-build-v0.2.0-20260820
