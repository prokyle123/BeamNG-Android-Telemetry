name: Build WorldSense v1 APK

on:
  push:
    branches:
      - worldsense-v1-build-20260820
    paths:
      - 'worldsense-v1/**'
      - '.github/workflows/worldsense-v1-build.yml'

permissions:
  contents: write

concurrency:
  group: worldsense-v1-republish
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build, sign, verify and record diagnostics
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/worldsense-v1-out"
          SRC="$GITHUB_WORKSPACE/worldsense-v1-src"
          SIGN="$GITHUB_WORKSPACE/worldsense-v1-signing"
          LOG="$OUT/build-log.txt"
          STATUS="$OUT/build-status.txt"
          rm -rf "$OUT" "$SRC"
          mkdir -p "$OUT" "$SRC" "$SIGN"
          : > "$LOG"
          code=0

          echo '=== reconstruct source ===' >> "$LOG"
          cat worldsense-v1/src.part* | tr -d '\r\n' | base64 -d > WorldSense-v1.0.0-SOURCE.zip 2>> "$LOG"
          code=$?
          if [ "$code" -eq 0 ]; then
            echo '220841a2115250020d300d5e4cd66f2e1b94e793c24bbd46d5212dd29ef1d393  WorldSense-v1.0.0-SOURCE.zip' | sha256sum -c - >> "$LOG" 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            unzip -q WorldSense-v1.0.0-SOURCE.zip -d "$SRC" >> "$LOG" 2>&1
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== osmdroid API compatibility patch ===' >> "$LOG"
            MAPFILE="$SRC/app/src/main/java/com/ghost/worldsense/WorldMapView.java"
            sed -i 's/Configuration cfg=Configuration.getInstance();/org.osmdroid.config.IConfigurationProvider cfg=Configuration.getInstance();/' "$MAPFILE"
            grep -n 'IConfigurationProvider cfg' "$MAPFILE" >> "$LOG" 2>&1
            code=$?
          fi

          KEYSTORE="$SIGN/worldsense-v1-dev.jks"
          if [ "$code" -eq 0 ]; then
            echo '=== stable signing key ===' >> "$LOG"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkeypair \
                -keystore "$KEYSTORE" \
                -storepass 'worldsense-dev-2026' \
                -keypass 'worldsense-dev-2026' \
                -alias 'worldsense-v1' \
                -keyalg RSA -keysize 3072 -validity 10000 \
                -dname 'CN=WorldSense Development,O=WorldSense,C=US' >> "$LOG" 2>&1
              code=$?
            fi
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== gradle release compile ===' >> "$LOG"
            cd "$SRC"
            gradle --no-daemon :app:assembleRelease >> "$LOG" 2>&1
            code=$?
            cd "$GITHUB_WORKSPACE"
          fi

          if [ "$code" -eq 0 ]; then
            echo '=== align + sign ===' >> "$LOG"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
            if [ -z "$BT" ]; then
              echo 'Android build-tools directory not found' >> "$LOG"
              code=90
            else
              UNSIGNED="$SRC/app/build/outputs/apk/release/app-release-unsigned.apk"
              ALIGNED="$OUT/WorldSense-v1.0.0-aligned.apk"
              APK="$OUT/WorldSense-v1.0.0.apk"
              "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED" >> "$LOG" 2>&1
              code=$?
              if [ "$code" -eq 0 ]; then
                "$BT/apksigner" sign \
                  --ks "$KEYSTORE" \
                  --ks-pass pass:worldsense-dev-2026 \
                  --key-pass pass:worldsense-dev-2026 \
                  --ks-key-alias worldsense-v1 \
                  --out "$APK" "$ALIGNED" >> "$LOG" 2>&1
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                "$BT/apksigner" verify --verbose --print-certs "$APK" > "$OUT/signing-report.txt" 2>&1
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                rm -f "$ALIGNED"
                (cd "$OUT" && sha256sum WorldSense-v1.0.0.apk > WorldSense-v1.0.0.apk.sha256)
              fi
            fi
          fi

          if [ "$code" -eq 0 ]; then
            printf 'WorldSense v1.0.0 build outcome: success\nWorkflow source commit: %s\n' "$GITHUB_SHA" > "$STATUS"
          else
            printf 'WorldSense v1.0.0 build outcome: failed\nWorkflow source commit: %s\nExit code: %s\n' "$GITHUB_SHA" "$code" > "$STATUS"
          fi
          exit 0

      - name: Commit result even when the build fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldsense-v1-out || true
          if [ -f worldsense-v1-signing/worldsense-v1-dev.jks ]; then
            git add worldsense-v1-signing/worldsense-v1-dev.jks
          fi
          git commit -m 'Record WorldSense v1.0.0 build result' || true
          git pull --rebase origin worldsense-v1-build-20260820 || true
          git push origin HEAD:worldsense-v1-build-20260820
