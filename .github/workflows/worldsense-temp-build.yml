name: Build WorldSense APK

on:
  push:
    branches:
      - worldsense-build-v0.1.0-20260820
    paths:
      - 'worldsense-build/src.part*'
      - '.github/workflows/worldsense-temp-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild WorldSense source archive
        shell: bash
        run: |
          set -euo pipefail
          cat worldsense-build/src.part* | tr -d '\r\n' | base64 -d > WorldSense-v0.1.0-CLEAN-SOURCE.zip
          echo 'ee59718742d0a96464cebaaba242c15fc7cc6ff608bbb0fc9622feacbb5df6a2  WorldSense-v0.1.0-CLEAN-SOURCE.zip' | sha256sum -c -
          mkdir worldsense
          unzip -q WorldSense-v0.1.0-CLEAN-SOURCE.zip -d worldsense

      - name: Build installable debug APK
        working-directory: worldsense
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          cp worldsense/app/build/outputs/apk/debug/app-debug.apk WorldSense-v0.1.0.apk
          sha256sum WorldSense-v0.1.0.apk > WorldSense-v0.1.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WorldSense-v0.1.0-APK
          path: |
            WorldSense-v0.1.0.apk
            WorldSense-v0.1.0.apk.sha256
          if-no-files-found: error

      - name: Publish APK to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worldsense-build
          cp WorldSense-v0.1.0.apk worldsense-build/WorldSense-v0.1.0.apk
          cp WorldSense-v0.1.0.apk.sha256 worldsense-build/WorldSense-v0.1.0.apk.sha256
          printf 'WorldSense v0.1.0 build succeeded\nCommit: %s\n' "$GITHUB_SHA" > worldsense-build/build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldsense-build/WorldSense-v0.1.0.apk worldsense-build/WorldSense-v0.1.0.apk.sha256 worldsense-build/build-status.txt
          git commit -m 'Build WorldSense v0.1.0 APK'
          git push origin HEAD:worldsense-build-v0.1.0-20260820
